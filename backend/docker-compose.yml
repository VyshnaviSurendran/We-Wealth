services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-we_wealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-we_wealth}
      POSTGRES_DB: ${POSTGRES_DB:-we_wealth}
    ports:
      - "5433:5432"
    volumes:
      - we_wealth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-we_wealth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-we_wealth}:${POSTGRES_PASSWORD:-we_wealth}@db:5432/${POSTGRES_DB:-we_wealth}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"

volumes:
  we_wealth_pgdata:
